mutation SeedFaqs {
  shipping: metaobjectCreate(metaobject: { type: "faq_item", fields: [
    { key: "question", value: "How long does shipping take?" }
    { key: "answer", value: "Standard shipping takes 3-5 business days. Express shipping (1-2 business days) is available at checkout." }
    { key: "category", value: "Shipping" }
    { key: "active", value: "true" }
  ] }) { metaobject { handle } userErrors { field message } }

  international: metaobjectCreate(metaobject: { type: "faq_item", fields: [
    { key: "question", value: "Do you ship internationally?" }
    { key: "answer", value: "Yes, we ship to most countries.\nDuties and taxes are calculated at checkout." }
    { key: "category", value: "Shipping" }
    { key: "active", value: "true" }
  ] }) { metaobject { handle } userErrors { field message } }

  returns: metaobjectCreate(metaobject: { type: "faq_item", fields: [
    { key: "question", value: "What is your return policy?" }
    { key: "answer", value: "You can return unused items within 30 days of delivery for a full refund." }
    { key: "category", value: "Returns" }
    { key: "active", value: "true" }
  ] }) { metaobject { handle } userErrors { field message } }

  payments: metaobjectCreate(metaobject: { type: "faq_item", fields: [
    { key: "question", value: "Which payment methods do you accept?" }
    { key: "answer", value: "We accept all major credit cards, PayPal and Shop Pay." }
    { key: "category", value: "Payments" }
    { key: "active", value: "false" }
  ] }) { metaobject { handle } userErrors { field message } }

  contact: metaobjectCreate(metaobject: { type: "faq_item", fields: [
    { key: "question", value: "How can I contact support?" }
    { key: "answer", value: "Email us at support@example.com and we will reply within one business day." }
    { key: "active", value: "true" }
  ] }) { metaobject { handle } userErrors { field message } }
}
